name: Profile - Rotating Skyline
'on':
  workflow_dispatch:
  schedule:
    - cron: '37 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/skyline.yml'
      - 'scripts/render-skyline.py'
      - 'scripts/requirements-skyline.txt'
      - 'scripts/publish-assets.sh'
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Satar2007/Satar2007' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install -r scripts/requirements-skyline.txt
      - name: Render actual GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/render-skyline.py --username Satar2007
      - name: Publish skyline
        env:
          TARGET_BRANCH: main
        run: bash scripts/publish-assets.sh assets/generated/skyline.gif assets/generated/skyline-poster.png

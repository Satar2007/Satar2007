name: Profile - Metrics

'on':
  workflow_dispatch:
  schedule:
    - cron: '57 0 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics.yml'
      - 'scripts/publish-assets.sh'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'Satar2007/Satar2007' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Check Metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo '::error::METRICS_TOKEN is missing.'
            exit 1
          fi

      - name: Generate GitHub overview
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: Satar2007
          token: ${{ secrets.METRICS_TOKEN }}

          filename: metrics.svg
          output_action: none

          template: classic
          config_timezone: Asia/Jakarta
          config_animations: 'yes'
          config_display: large
          config_padding: 24

          retries: 2
          retries_delay: 30
          plugins_errors_fatal: 'no'

          base: header, activity, community, repositories

          plugin_languages: 'yes'
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_indepth: 'no'

          config_order: base.header, base.activity+community, base.repositories, languages

      - name: Generate full-year isometric calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: Satar2007
          token: ${{ secrets.METRICS_TOKEN }}

          filename: isocalendar.svg
          output_action: none

          template: classic
          config_timezone: Asia/Jakarta
          config_animations: 'yes'
          config_display: large
          config_padding: 24

          retries: 2
          retries_delay: 30
          plugins_errors_fatal: 'no'

          base: ''

          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: full-year

      - name: Verify generated SVG files
        shell: bash
        run: |
          echo '=== /metrics_renders ==='
          sudo ls -lah /metrics_renders || true

          test -s /metrics_renders/metrics.svg || {
            echo '::error::metrics.svg was not generated.'
            exit 1
          }

          test -s /metrics_renders/isocalendar.svg || {
            echo '::error::isocalendar.svg was not generated.'
            exit 1
          }

      - name: Publish metrics
        env:
          TARGET_BRANCH: main
        run: |
          mkdir -p assets/generated

          cp /metrics_renders/metrics.svg \
             assets/generated/metrics.svg

          cp /metrics_renders/isocalendar.svg \
             assets/generated/isocalendar.svg

          bash scripts/publish-assets.sh \
            assets/generated/metrics.svg \
            assets/generated/isocalendar.svg
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc">
<title id="title">Rafael Bintang Developer Dashboard</title>
<desc id="desc">Futuristic developer dashboard for the Satar2007 GitHub profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.55" stop-color="#081827"/>
    <stop offset="1" stop-color="#06111c"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1b2b"/>
    <stop offset="1" stop-color="#07131f"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#12314a" stroke-width="1" opacity=".25"/>
  </pattern>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}
    .m{font-family:Consolas,Menlo,monospace}
    .muted{fill:#8aa0b8}
    .cyan{fill:#38bdf8}
    .line{stroke:#1e5677;stroke-width:1}
    .soft{fill:#0b1d2d;stroke:#174462;stroke-width:1.2}
    .chip{fill:#0d2032;stroke:#1a5474;stroke-width:1.2}
    .title{font-size:34px;font-weight:700}
    .h2{font-size:20px;font-weight:700;letter-spacing:1.5px}
    .body{font-size:18px}
    .small{font-size:14px}
    .tiny{font-size:12px}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{0%{transform:translateY(-20px);opacity:0}10%{opacity:.35}90%{opacity:.25}100%{transform:translateY(1300px);opacity:0}}
    .blink{animation:blink 1s steps(1,end) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .pulse1{animation:pulse 4s ease-in-out infinite}
    .pulse2{animation:pulse 4s ease-in-out .5s infinite}
    .pulse3{animation:pulse 4s ease-in-out 1s infinite}
    .pulse4{animation:pulse 4s ease-in-out 1.5s infinite}
    .pulse5{animation:pulse 4s ease-in-out 2s infinite}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1;filter:url(#glow)}}
    .pac{animation:pacmove 7s linear infinite}
    @keyframes pacmove{0%{transform:translateX(0)}100%{transform:translateX(980px)}}
    .dot{animation:dotfade 7s linear infinite}
    @keyframes dotfade{0%,15%{opacity:1}90%,100%{opacity:.2}}
  </style>
</defs>

<rect width="1200" height="1480" rx="28" fill="url(#bg)"/>
<rect width="1200" height="1480" rx="28" fill="url(#grid)"/>
<rect x="2" y="2" width="1196" height="1476" rx="26" fill="none" stroke="#1e6d93" stroke-width="2"/>

<!-- header -->
<text x="48" y="62" class="t m cyan title">&gt;_ Developer dashboard</text>
<text x="830" y="58" class="t m muted small">BUILD · LEARN · EXPLORE · CREATE</text>
<line x1="42" y1="90" x2="1158" y2="90" class="line"/>
<circle cx="1090" cy="45" r="5" fill="#38bdf8" class="pulse1"/>
<circle cx="1110" cy="45" r="5" fill="#38bdf8" class="pulse2"/>
<circle cx="1130" cy="45" r="5" fill="#38bdf8" class="pulse3"/>

<!-- about -->
<rect x="42" y="118" width="660" height="300" rx="18" class="soft"/>
<text x="68" y="155" class="t m cyan h2">01. ABOUT ME</text>
<text x="68" y="198" class="t body">
  <tspan x="68" dy="0">Halo! Saya Bintang, mahasiswa S1 Informatika</tspan>
  <tspan x="68" dy="28">Universitas Sanata Dharma, berasal dari Manyaran,</tspan>
  <tspan x="68" dy="28">Wonogiri. Saya membangun aplikasi yang bermanfaat,</tspan>
  <tspan x="68" dy="28">mendokumentasikan proses belajar, dan berkolaborasi</tspan>
  <tspan x="68" dy="28">melalui Git dan GitHub.</tspan>
</text>
<text x="68" y="382" class="t muted small">⌖  Manyaran, Wonogiri</text>

<!-- focus -->
<rect x="724" y="118" width="434" height="300" rx="18" class="soft"/>
<text x="750" y="155" class="t m cyan h2">02. WHAT I FOCUS ON</text>
<g class="t">
  <rect x="750" y="180" width="380" height="48" rx="10" class="chip"/>
  <text x="770" y="210" class="body cyan">▣  Building</text>
  <text x="935" y="200" class="tiny muted">JIMNY COFFEE</text><text x="935" y="216" class="tiny muted">Laravel POS</text>
  <rect x="750" y="238" width="380" height="48" rx="10" class="chip"/>
  <text x="770" y="268" class="body cyan">▤  Learning</text>
  <text x="935" y="258" class="tiny muted">Web · Database</text><text x="935" y="274" class="tiny muted">AI · Citra</text>
  <rect x="750" y="296" width="380" height="48" rx="10" class="chip"/>
  <text x="770" y="326" class="body cyan">◉  Exploring</text>
  <text x="935" y="316" class="tiny muted">Interactive UI</text><text x="935" y="332" class="tiny muted">3D for web</text>
  <rect x="750" y="354" width="380" height="48" rx="10" class="chip"/>
  <text x="770" y="384" class="body cyan">◆  Beyond coding</text>
  <text x="935" y="374" class="tiny muted">Hiking</text><text x="935" y="390" class="tiny muted">Gaming</text>
</g>


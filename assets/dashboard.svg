<g transform="translate(42 508)">
  <g class="pulse1"><rect x="0" y="0" width="102" height="88" rx="14" class="chip"/><text x="51" y="40" text-anchor="middle" class="t m body">PHP</text><text x="51" y="68" text-anchor="middle" class="t m cyan tiny">PHP</text></g>
  <g class="pulse2"><rect x="112" y="0" width="102" height="88" rx="14" class="chip"/><text x="163" y="40" text-anchor="middle" class="t m body">◇</text><text x="163" y="68" text-anchor="middle" class="t m cyan tiny">LARAVEL</text></g>
  <g class="pulse3"><rect x="224" y="0" width="102" height="88" rx="14" class="chip"/><text x="275" y="40" text-anchor="middle" class="t m body">5</text><text x="275" y="68" text-anchor="middle" class="t m cyan tiny">HTML</text></g>
  <g class="pulse4"><rect x="336" y="0" width="102" height="88" rx="14" class="chip"/><text x="387" y="40" text-anchor="middle" class="t m body">3</text><text x="387" y="68" text-anchor="middle" class="t m cyan tiny">CSS</text></g>
  <g class="pulse5"><rect x="448" y="0" width="102" height="88" rx="14" class="chip"/><text x="499" y="40" text-anchor="middle" class="t m body">JS</text><text x="499" y="68" text-anchor="middle" class="t m cyan tiny">JAVASCRIPT</text></g>
  <g class="pulse1"><rect x="560" y="0" width="102" height="88" rx="14" class="chip"/><text x="611" y="40" text-anchor="middle" class="t m body">≈</text><text x="611" y="68" text-anchor="middle" class="t m cyan tiny">TAILWIND</text></g>
  <g class="pulse2"><rect x="672" y="0" width="102" height="88" rx="14" class="chip"/><text x="723" y="40" text-anchor="middle" class="t m body">SQL</text><text x="723" y="68" text-anchor="middle" class="t m cyan tiny">MYSQL</text></g>
  <g class="pulse3"><rect x="784" y="0" width="102" height="88" rx="14" class="chip"/><text x="835" y="40" text-anchor="middle" class="t m body">Py</text><text x="835" y="68" text-anchor="middle" class="t m cyan tiny">PYTHON</text></g>
  <g class="pulse4"><rect x="896" y="0" width="102" height="88" rx="14" class="chip"/><text x="947" y="40" text-anchor="middle" class="t m body">◆</text><text x="947" y="68" text-anchor="middle" class="t m cyan tiny">GIT</text></g>
  <g class="pulse5"><rect x="1008" y="0" width="102" height="88" rx="14" class="chip"/><text x="1059" y="40" text-anchor="middle" class="t m body">●</text><text x="1059" y="68" text-anchor="middle" class="t m cyan tiny">GITHUB</text></g>
</g>


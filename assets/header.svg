<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">SATAR — Rafael Bintang</title><desc id="desc">Informatics student. Building JIMNY COFFEE. A floating isometric cube and animated developer roles.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#080e1a"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#124e70" stop-opacity=".6"/><stop offset="1" stop-color="#0a1020" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
 <clipPath id="typing"><rect x="58" y="228" width="630" height="40" class="typing"/></clipPath>
 <style>
 text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
 .floating{animation:float 6s ease-in-out infinite}.orbit{transform-origin:929px 186px;animation:orbit 25s linear infinite}
 .typing{animation:type 12s steps(32,end) infinite}.cursor{animation:blink 1s steps(1,end) infinite}
 .role1{animation:one 12s steps(1,end) infinite}.role2{opacity:0;animation:two 12s steps(1,end) infinite}.role3{opacity:0;animation:three 12s steps(1,end) infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
 @keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}
 @keyframes type{0%,33.33%,66.66%,100%{width:0}12%,30%,46%,63%,79%,97%{width:630px}}
 @keyframes one{0%{opacity:1}33.33%,100%{opacity:0}}@keyframes two{0%{opacity:0}33.33%{opacity:1}66.66%,100%{opacity:0}}@keyframes three{0%,33.33%{opacity:0}66.66%{opacity:1}100%{opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{width:630px}.role1{opacity:1}.role2,.role3{opacity:0}.cursor{opacity:0}}
 </style>
</defs>
<rect x="1" y="1" width="1198" height="378" rx="24" fill="url(#bg)" stroke="#23344d"/>
<rect x="2" y="2" width="1196" height="376" rx="24" fill="url(#grid)"/>
<ellipse cx="931" cy="185" rx="290" ry="190" fill="url(#glow)"/>
<path d="M58 57H96" stroke="url(#edge)" stroke-width="3"/>
<text x="111" y="63" font-size="17" fill="#8cb9d9" letter-spacing="5" class="mono">SATAR / BUILD &amp; LEARN</text>
<text x="56" y="145" font-size="62" font-weight="700" fill="#eef6ff" letter-spacing="-2">Rafael Bintang<tspan class="cursor" fill="#38bdf8">_</tspan></text>
<text x="59" y="188" font-size="20" fill="#9bb0ca">Informatics student · Universitas Sanata Dharma</text>
<g clip-path="url(#typing)" font-size="21" fill="#62d4fb" class="mono">
 <text x="59" y="255" class="role1">&gt; Building JIMNY COFFEE</text>
 <text x="59" y="255" class="role2">&gt; Exploring web development &amp; 3D</text>
 <text x="59" y="255" class="role3">&gt; Learning intelligent systems</text>
</g>
<text x="59" y="326" font-size="13" fill="#7087a7" letter-spacing="2" class="mono">MANYARAN, WONOGIRI</text>
<circle cx="933" cy="185" r="136" fill="none" stroke="#294362" stroke-dasharray="3 9"/>
<ellipse cx="933" cy="303" rx="109" ry="15" fill="#020914" opacity=".8"/>
<g class="orbit"><circle cx="929" cy="50" r="5" fill="#38bdf8"/><circle cx="929" cy="322" r="3" fill="#a5b4fc"/></g>
<g class="floating" stroke-linejoin="round">
 <path d="M933 89L1041 146L933 207L825 146Z" fill="#235782" stroke="#75d6ff" stroke-width="2"/>
 <path d="M825 146L933 207V285L825 221Z" fill="#132b49" stroke="#34709c" stroke-width="2"/>
 <path d="M1041 146L933 207V285L1041 221Z" fill="#163f60" stroke="#53bbec" stroke-width="2"/>
 <path d="M933 113L1000 148L933 185L866 148Z" fill="#173c5a" stroke="#66c6f6"/>
 <text x="934" y="157" font-size="22" fill="#d6f1ff" text-anchor="middle" font-weight="700" class="mono">&lt;/&gt;</text>
 <path d="M825 183L933 247L1041 183M881 176V253M988 176V253" fill="none" stroke="#489dc7" stroke-opacity=".35"/>
</g>
<text x="934" y="348" font-size="12" fill="#719bc0" letter-spacing="4" text-anchor="middle" class="mono">IDEAS INTO CODE</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 90" role="img" aria-label="Animated energy divider">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4060"/>
      <stop offset="50%" stop-color="#7a34ff"/>
      <stop offset="100%" stop-color="#58dcff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="90" fill="#060b12"/>
  <line x1="64" y1="45" x2="1536" y2="45" stroke="#1d2b3b" stroke-width="4"/>
  <line x1="64" y1="45" x2="1536" y2="45" stroke="url(#g)" stroke-width="4" stroke-dasharray="220 1250">
    <animate attributeName="stroke-dashoffset" from="1470" to="-1470" dur="7s" repeatCount="indefinite"/>
  </line>
  <circle cx="800" cy="45" r="9" fill="#dff9ff"><animate attributeName="r" values="7;13;7" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="800" y="24" text-anchor="middle" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="17" fill="#9bb4c6">:: ENERGY LINK //</text>
</svg>